<article
    class="group relative flex flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-900/5 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg"
>
    <div class="relative aspect-[4/3] overflow-hidden bg-slate-50">
        @if (imageUrl(); as url) {
            <img
                [src]="url"
                [alt]="listing().title"
                class="size-full object-cover transition-transform duration-200 group-hover:scale-105"
                [class.opacity-0]="!loaded()"
                [class.reveal]="loaded()"
                (load)="loaded.set(true)"
            />
        } @else {
            <div class="hatch flex size-full flex-col items-center justify-center gap-2 transition-transform duration-200 group-hover:scale-105">
                <svg class="size-8 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                    <circle cx="5.5" cy="17" r="3.5" />
                    <circle cx="18.5" cy="17" r="3.5" />
                    <path d="M5.5 17h5l4-7h-4M14 6h3l1.5 11" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{{ brandName() }}</span>
            </div>
        }

        <span
            class="absolute left-3 top-3 rounded-lg bg-white/80 px-2 py-1 text-[11px] font-semibold uppercase tracking-wider ring-1 ring-slate-900/5 backdrop-blur-sm"
            [class.text-emerald-700]="isNew()"
            [class.text-slate-600]="!isNew()"
        >{{ listing().condition }}</span>

        @if (imageCount() > 1) {
            <span class="absolute bottom-3 right-3 rounded-md bg-slate-900/70 px-1.5 py-0.5 text-[11px] font-semibold tabular-nums text-white backdrop-blur-sm">
                1/{{ imageCount() }}
            </span>
        }

        <button
            type="button"
            class="absolute right-3 top-3 z-10 grid size-8 place-items-center rounded-full bg-white/80 ring-1 ring-slate-900/5 backdrop-blur-sm transition-all duration-200 hover:bg-white active:scale-[0.98]"
            [class.text-amber-500]="favorite()"
            [class.text-slate-400]="!favorite()"
            [attr.aria-pressed]="favorite()"
            [attr.aria-label]="favorite() ? 'Remove from favourites' : 'Save to favourites'"
            (click)="toggle($event)"
        >
            <svg class="size-4" viewBox="0 0 24 24" [attr.fill]="favorite() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
                <path d="M12 21s-8-4.9-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 5.1-8 10-8 10z" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <div class="flex flex-1 flex-col p-4">
        <h3 class="truncate text-sm font-semibold">
            <a [routerLink]="['/listings', listing()._id]" class="after:absolute after:inset-0 after:content-['']">
                {{ listing().title }}
            </a>
        </h3>

        <p class="mt-1 text-lg font-bold tabular-nums tracking-tight">
            {{ listing().price | number }}<span class="ml-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">EGP</span>
        </p>

        <div class="mt-3 flex flex-wrap gap-1.5">
            <span class="rounded-md bg-slate-50 px-2 py-1 text-xs font-medium tabular-nums text-slate-600 ring-1 ring-slate-900/5">{{ listing().year }}</span>
            <span class="rounded-md bg-slate-50 px-2 py-1 text-xs font-medium tabular-nums text-slate-600 ring-1 ring-slate-900/5">{{ listing().mileage | number }} km</span>
            <span class="rounded-md bg-slate-50 px-2 py-1 text-xs font-medium tabular-nums text-slate-600 ring-1 ring-slate-900/5">{{ listing().engineCC }}cc</span>
        </div>

        <p class="mt-3 flex items-center gap-1.5 text-xs text-slate-500">
            <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z" stroke-linejoin="round" />
                <circle cx="12" cy="10" r="2.5" />
            </svg>
            {{ listing().city }}
        </p>
    </div>
</article>
