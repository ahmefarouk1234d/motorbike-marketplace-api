@if (sent()) {
    <section class="mx-auto flex w-full max-w-md flex-col items-center px-4 py-20 text-center sm:px-0">
        <span class="grid size-14 place-items-center rounded-2xl bg-emerald-50 text-emerald-700 ring-1 ring-emerald-600/10">
            <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 7l9 6 9-6" stroke-linecap="round" stroke-linejoin="round" />
                <rect x="3" y="5" width="18" height="14" rx="2" />
            </svg>
        </span>

        <h1 class="mt-6 text-4xl/tight font-bold tracking-tight text-balance">Check your email</h1>
        <p class="mt-3 text-sm text-slate-500">
            If an account exists for that address, a reset link is on its way. It expires in an hour.
        </p>

        <a
            routerLink="/login"
            class="mt-8 w-full rounded-xl bg-slate-900 px-5 py-3 text-center text-sm font-semibold text-white transition-all duration-200 hover:shadow-lg active:scale-[0.98]"
        >Back to sign in</a>
    </section>
} @else {
    <section class="mx-auto flex w-full max-w-md flex-col px-4 py-16 sm:px-0">
        <h1 class="text-4xl/tight font-bold tracking-tight">Reset your password</h1>
        <p class="mt-2 text-sm text-slate-500">Enter your email and we will send you a link.</p>

        <form class="mt-8 flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
            @if (failed()) {
                <div class="rise rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 ring-1 ring-red-600/10">
                    {{ failed() }}
                </div>
            }

            <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Email</span>
                <input
                    type="email"
                    autocomplete="email"
                    formControlName="email"
                    class="rounded-xl bg-white px-3 py-2.5 text-sm ring-1 ring-slate-900/5 outline-none transition-all duration-200 focus:ring-2 focus:ring-slate-900"
                    [class.ring-red-500]="form.controls.email.touched && form.controls.email.invalid"
                />
                @if (form.controls.email.touched && form.controls.email.invalid) {
                    <span class="rise text-xs text-red-600">
                        {{ form.controls.email.hasError('required') ? 'Enter your email address' : 'That email address does not look right' }}
                    </span>
                }
            </label>

            <button
                type="submit"
                class="mt-2 flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:shadow-lg active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
                [disabled]="pending()"
            >
                @if (pending()) {
                    <span class="spinner size-4 rounded-full border-2 border-white/30 border-t-white"></span>
                    Sending
                } @else {
                    Send reset link
                }
            </button>

            <a routerLink="/login" class="text-center text-xs font-semibold text-slate-500 transition-all duration-200 hover:text-slate-900">
                Back to sign in
            </a>
        </form>
    </section>
}
