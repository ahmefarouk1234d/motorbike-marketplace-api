<section class="mx-auto flex w-full max-w-md flex-col px-4 py-16 sm:px-0">
    <h1 class="text-4xl/tight font-bold tracking-tight">Choose a new password</h1>
    <p class="mt-2 text-sm text-slate-500">You will be signed in once it is saved.</p>

    <form class="mt-8 flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
        @if (failed()) {
            <div class="rise flex flex-col gap-2 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 ring-1 ring-red-600/10">
                <span>{{ failed() }}</span>
                <a routerLink="/forgot-password" class="font-semibold underline underline-offset-4">Request a new link</a>
            </div>
        }

        <label class="flex flex-col gap-1.5">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">New password</span>
            <input
                type="password"
                autocomplete="new-password"
                formControlName="password"
                class="rounded-xl bg-white px-3 py-2.5 text-sm ring-1 ring-slate-900/5 outline-none transition-all duration-200 focus:ring-2 focus:ring-slate-900"
                [class.ring-red-500]="form.controls.password.touched && form.controls.password.invalid"
            />
            @if (form.controls.password.touched && form.controls.password.invalid) {
                <span class="rise text-xs text-red-600">Use at least 8 characters</span>
            } @else {
                <span class="text-xs text-slate-500">At least 8 characters.</span>
            }
        </label>

        <button
            type="submit"
            class="mt-2 flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:shadow-lg active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="pending()"
        >
            @if (pending()) {
                <span class="spinner size-4 rounded-full border-2 border-white/30 border-t-white"></span>
                Saving
            } @else {
                Save password
            }
        </button>
    </form>
</section>
